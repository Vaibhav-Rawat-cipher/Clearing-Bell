[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "scripts"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
verbosity = 2

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "auction/=src/auction/",
    "hook/=src/hooks/",
    # Uniswap v4 — use the OZ hooks' bundled v4-core (has PoolOperation.sol required by BaseHook)
    "@uniswap/v4-core/=lib/uniswap-hooks/lib/v4-core/",
    "@openzeppelin/uniswap-hooks/=lib/uniswap-hooks/",
    # HookMiner — inlined to avoid v4-periphery submodule pull
    "v4-periphery/utils/HookMiner.sol=test/mocks/HookMiner.sol",
]

[profile.default.fuzz]
runs = 256

[profile.ci]
fuzz = { runs = 1000 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
